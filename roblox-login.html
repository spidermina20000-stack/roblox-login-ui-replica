<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Background */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: 
                linear-gradient(45deg, #ff6b35 0%, #004e89 25%, #1a659e 50%, #f77f00 75%, #06a77d 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Multiple background images overlay (game screenshots effect) */
        .background::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 107, 53, 0.3) 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(0, 78, 137, 0.3) 0%, transparent 30%),
                radial-gradient(circle at 40% 80%, rgba(26, 165, 125, 0.3) 0%, transparent 30%),
                radial-gradient(circle at 70% 20%, rgba(247, 127, 0, 0.3) 0%, transparent 30%);
            pointer-events: none;
        }

        /* Dark overlay */
        .background-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        /* Container */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        /* Login Card */
        .login-card {
            background: rgba(0, 0, 0, 0.85);
            border-radius: 8px;
            padding: 40px 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo */
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-text {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: -2px;
            color: #ffffff;
            text-transform: uppercase;
            margin: 0;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Form Group */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #cccccc;
            margin-bottom: 6px;
            text-transform: capitalize;
        }

        .form-input {
            width: 100%;
            padding: 12px 12px;
            background: #333333;
            border: 1px solid #555555;
            border-radius: 4px;
            font-size: 14px;
            color: #ffffff;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .form-input::placeholder {
            color: #999999;
        }

        .form-input:focus {
            outline: none;
            border-color: #0066cc;
            background: #3a3a3a;
        }

        .form-input:hover {
            border-color: #666666;
        }

        /* Buttons */
        .login-button {
            width: 100%;
            padding: 12px;
            background: #a0a0a0;
            color: #000000;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 12px;
            text-transform: capitalize;
        }

        .login-button:hover {
            background: #b0b0b0;
        }

        .login-button:active {
            background: #909090;
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .device-button {
            width: 100%;
            padding: 12px;
            background: #1a8917;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 12px;
            text-transform: capitalize;
        }

        .device-button:hover {
            background: #228b22;
        }

        .device-button:active {
            background: #1a7a1a;
        }

        /* Links */
        .forgot-password {
            text-align: center;
            margin-top: 16px;
        }

        .forgot-link {
            font-size: 12px;
            color: #cccccc;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .forgot-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        /* Error Message */
        .error-message {
            font-size: 12px;
            color: #ff4444;
            margin-top: 4px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Success Screen */
        .success-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 100;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .success-screen.active {
            display: flex;
        }

        .success-message {
            text-align: center;
            color: #ffffff;
        }

        .success-message h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .success-message p {
            font-size: 14px;
            color: #cccccc;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }

            .logo-text {
                font-size: 40px;
            }

            .form-input {
                font-size: 16px;
                padding: 12px 12px;
            }
        }
    </style>
</head>
<body>
    <!-- Background -->
    <div class="background">
        <div class="background-overlay"></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <div class="login-card">
            <!-- Logo -->
            <div class="logo-section">
                <h1 class="logo-text">ROBLOX</h1>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <!-- Username/Email Field -->
                <div class="form-group">
                    <label class="form-label">Username or Email</label>
                    <input 
                        type="text" 
                        id="username" 
                        class="form-input" 
                        placeholder="Username or Email"
                        required
                    >
                    <div class="error-message" id="usernameError"></div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Password"
                        required
                    >
                    <div class="error-message" id="passwordError"></div>
                </div>

                <!-- Error Message -->
                <div class="error-message" id="formError"></div>

                <!-- Log In Button -->
                <button type="submit" class="login-button">Log In</button>

                <!-- Log In With Another Device Button -->
                <button type="button" class="device-button" id="deviceButton">Log In With Another Device</button>
            </form>

            <!-- Forgot Password Link -->
            <div class="forgot-password">
                <a href="#" class="forgot-link" id="forgotLink">Forgot Password or Username?</a>
            </div>
        </div>
    </div>

    <!-- Success Screen -->
    <div class="success-screen" id="successScreen">
        <div class="success-message">
            <h2>✓ Login Successful</h2>
            <p>Welcome back to Roblox!</p>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const usernameError = document.getElementById('usernameError');
        const passwordError = document.getElementById('passwordError');
        const formError = document.getElementById('formError');
        const successScreen = document.getElementById('successScreen');
        const deviceButton = document.getElementById('deviceButton');
        const forgotLink = document.getElementById('forgotLink');

        // Clear errors on input
        usernameInput.addEventListener('input', function() {
            usernameError.classList.remove('show');
            formError.classList.remove('show');
        });

        passwordInput.addEventListener('input', function() {
            passwordError.classList.remove('show');
            formError.classList.remove('show');
        });

        // Form submission
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            usernameError.classList.remove('show');
            passwordError.classList.remove('show');
            formError.classList.remove('show');
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            
            let isValid = true;
            
            if (!username) {
                usernameError.textContent = 'Please enter your username or email address.';
                usernameError.classList.add('show');
                isValid = false;
            }
            
            if (!password) {
                passwordError.textContent = 'Please enter your password.';
                passwordError.classList.add('show');
                isValid = false;
            }
            
            if (!isValid) {
                formError.textContent = 'Incorrect username or password.';
                formError.classList.add('show');
                return;
            }
            
            // Simulate login
            const loginButton = loginForm.querySelector('.login-button');
            const originalText = loginButton.textContent;
            loginButton.textContent = 'Logging in...';
            loginButton.disabled = true;
            deviceButton.disabled = true;
            
            setTimeout(() => {
                successScreen.classList.add('active');
            }, 1500);
        });

        // Device button
        deviceButton.addEventListener('click', function(e) {
            e.preventDefault();
            alert('Redirecting to device login...\n(This is a simulation)');
        });

        // Forgot password
        forgotLink.addEventListener('click', function(e) {
            e.preventDefault();
            alert('Redirecting to password recovery...\n(This is a simulation)');
        });

        // Keyboard support
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (document.activeElement === usernameInput || document.activeElement === passwordInput) {
                    loginForm.dispatchEvent(new Event('submit'));
                }
            }
        });
    </script>
</body>
</html>
